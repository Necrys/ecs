# Continuous integration.
#
# Two platforms, because the project claims both and the code differs under them:
# Linux with the compilers that matter there, Windows with MSVC. The toolchains are
# the ones the project pins rather than whatever the image happens to carry: LLVM 22
# is installed on the Linux runner, so a run here and a run at home look at the same
# formatter, the same checks and the same coverage tools.
#
# The Raspberry Pi boards are deliberately absent. No hosted runner has ARMv6 or
# ARMv7 hardware, a runner on the production Pi is not a risk worth taking for this,
# and cross-compiling would prove only that the code assembles. The boards stay
# local and manual, as recorded in the plan.
#
# Each job publishes JUnit reports, the coverage tracefile and its HTML, and a small
# markdown fragment. The fragments are collected by the summary job, which is the
# dashboard for the run. Nothing is committed back: results are artefacts, and the
# repository holds only the library, the tests and the tools.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A superseded run says nothing useful about the current tip, and the slow test
# makes each of them a minute longer than it needs to be.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  linux-clang:
    name: Linux, clang 22
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      # The image carries clang 16, 17 and 18, and the project pins one major: the
      # formatter refuses another, and -Weverything differs between majors, so a run
      # against the image's clang would be reporting on a tool nobody uses. LLVM's
      # repository has 22 for noble, and its bin directory holds unversioned names,
      # which is what the scripts look for.
      #
      # llvm.sh only adds the repository and installs clang, lldb, lld and clangd -
      # the rest of its list needs the "all" argument. The packages this project
      # actually runs are named here instead, including llvm-22 (llvm-cov and
      # llvm-profdata live in it) and clang-format-22 (the formatter the project
      # pins; without it the image's clang-format 18 is found and refused).
      - name: Install LLVM 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-22 clang-tidy-22 clang-format-22 llvm-22 libclang-rt-22-dev
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Tools in use
        run: |
          clang++ --version | head -n 1
          clang-format --version
          cmake --version | head -n 1

      - name: Formatting
        run: python3 tools/format.py --check

      # Instrumented Debug build, the whole suite - including the case that exhausts
      # the entity id space - the merged lcov, the HTML report and the floor check.
      # This is the same command a developer runs before a commit, so the gate here
      # and the gate at home cannot drift apart.
      #
      # Every report path is named here rather than left to the tools' defaults: a
      # default follows the preset, and the preset's build directory is not the same
      # on both platforms (`build/coverage` here is clang-cl's, `build/linux-coverage`
      # is this job's). Naming them keeps the paths the job writes to, reads from and
      # uploads identical, which is the only reason the three can be checked against
      # each other.
      - name: Coverage
        run: |
          python3 tools/coverage.py \
            --preset linux-coverage \
            --lcov build/coverage/merged.lcov \
            --html build/coverage/html \
            --junit "${{ github.workspace }}/junit-coverage.xml" \
            --uncovered \
            --summary summary-linux-clang.md

      # The job says "clang 22", so it checks that this is what the configuration
      # actually picked. A runner with several compilers on PATH otherwise builds
      # something else and the job name quietly becomes a lie.
      - name: Assert the compiler is clang 22
        run: |
          grep -E '^CMAKE_CXX_COMPILER:' build/linux-coverage/CMakeCache.txt
          grep -q 'llvm-22' build/linux-coverage/CMakeCache.txt || {
            echo "the coverage build did not use LLVM 22" >&2; exit 1; }

      # Release is not a repeat of the Debug run above: the optimiser inlines
      # differently, the standard library's own checks are gone, and -Werror sees
      # different code. This is also the configuration the benchmarks measure.
      #
      # The JUnit path is absolute because ctest resolves --output-junit relative to
      # --test-dir, not to the working directory: a bare `junit-release.xml` lands in
      # build/release/, where nothing looks for it. That is why these reports used to
      # be read as zero tests.
      - name: Build and test (Release)
        run: |
          cmake --preset linux-clang -B build/release -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure \
            --output-junit "${{ github.workspace }}/junit-release.xml"

      - name: clang-tidy
        run: python3 tools/check.py --no-format --no-build --no-tests --tidy

      - name: Summary
        if: always()
        run: |
          python3 tools/junit_summary.py --strict --title "Tests (clang 22)" \
            junit-coverage.xml junit-release.xml >> summary-linux-clang.md
          cat summary-linux-clang.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the summary fragment
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: summary-linux-clang
          path: summary-linux-clang.md

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports-linux-clang
          path: |
            build/coverage/merged.lcov
            build/coverage/html
            junit-coverage.xml
            junit-release.xml
          # A report that was not there is the defect this upload would otherwise
          # hide: the artifact simply would not exist, and nobody would look.
          if-no-files-found: error

  linux-gcc:
    name: Linux, GCC 14
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Tools in use
        run: |
          g++-14 --version | head -n 1
          cmake --version | head -n 1

      # GCC 14 rather than the image's default 13, because 14.2 is what the boards
      # run: a second compiler is only interesting if it is the one that matters.
      - name: Build and test (Debug)
        run: |
          cmake --preset linux-gcc -B build/gcc-debug \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build/gcc-debug --parallel
          ctest --test-dir build/gcc-debug --output-on-failure \
            --output-junit "${{ github.workspace }}/junit-gcc-debug.xml"

      - name: Assert the compiler is GCC 14
        run: |
          grep -E '^CMAKE_CXX_COMPILER:' build/gcc-debug/CMakeCache.txt
          grep -q 'g++-14' build/gcc-debug/CMakeCache.txt || {
            echo "the Debug build did not use g++-14" >&2; exit 1; }

      # AddressSanitizer plus UndefinedBehaviorSanitizer, and on Linux this includes
      # leak detection, which the MSVC runtime does not do - so this is the job that
      # would notice a page nobody frees.
      - name: Build and test (ASan and UBSan)
        run: |
          cmake --preset linux-gcc -B build/gcc-asan \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DECS_ENABLE_ASAN=ON -DECS_ENABLE_UBSAN=ON
          cmake --build build/gcc-asan --parallel
          ctest --test-dir build/gcc-asan --output-on-failure \
            --output-junit "${{ github.workspace }}/junit-gcc-asan.xml"

      - name: Summary
        if: always()
        run: |
          python3 tools/junit_summary.py --strict --title "Tests (GCC 14)" \
            junit-gcc-debug.xml junit-gcc-asan.xml >> summary-linux-gcc.md
          cat summary-linux-gcc.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the summary fragment
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: summary-linux-gcc
          path: summary-linux-gcc.md

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports-linux-gcc
          path: |
            junit-gcc-debug.xml
            junit-gcc-asan.xml
          if-no-files-found: error

  windows-msvc:
    name: Windows, MSVC
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      # One step, because the compiler environment is the awkward part here: cl.exe
      # is not on the runner's PATH, and tools/check.py loads vcvars64 itself before
      # it configures anything. It then builds the Debug configuration, runs the
      # suite, and repeats both under MSVC's AddressSanitizer - which is the only
      # working sanitizer on Windows, for the reasons tools/cmake/Sanitizers.cmake
      # records.
      - name: Build, test, and run under ASan
        run: python tools/check.py --no-format --sanitizers

      # The first run of this job built with MinGW: the runner has it on PATH, the
      # presets did not pin a compiler, and the name of the job said MSVC. Now they
      # do pin one, and this checks that the pin bit.
      - name: Assert the compiler is MSVC
        shell: bash
        run: |
          grep -E '^CMAKE_CXX_COMPILER:' build/tests-only/CMakeCache.txt build/msvc-asan/CMakeCache.txt
          grep -qi 'cl\.exe' build/tests-only/CMakeCache.txt || {
            echo "the Debug build is not MSVC" >&2; exit 1; }
          grep -qi 'cl\.exe' build/msvc-asan/CMakeCache.txt || {
            echo "the ASan build is not MSVC" >&2; exit 1; }

      - name: Summary
        if: always()
        shell: bash
        run: |
          python tools/junit_summary.py --strict --title "Tests (MSVC)" \
            build/tests-only/junit.xml build/msvc-asan/junit.xml > summary-windows-msvc.md
          cat summary-windows-msvc.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the summary fragment
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: summary-windows-msvc
          path: summary-windows-msvc.md

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports-windows-msvc
          path: |
            build/tests-only/junit.xml
            build/msvc-asan/junit.xml
          # See reports-linux-clang: a missing report is what this upload is here to
          # make visible, not to swallow.
          if-no-files-found: error

  summary:
    name: Summary
    needs: [linux-clang, linux-gcc, windows-msvc]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Collect the fragments
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: summary-*
          merge-multiple: true
          path: summaries

      - name: Publish the run summary
        run: |
          {
            echo "# CI"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Linux, clang 22 | ${{ needs.linux-clang.result }} |"
            echo "| Linux, GCC 14 | ${{ needs.linux-gcc.result }} |"
            echo "| Windows, MSVC | ${{ needs.windows-msvc.result }} |"
            echo
            find summaries -name '*.md' -print -exec cat {} + 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
